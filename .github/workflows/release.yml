name: Release

on:
  push:
    branches:
      - main
      - beta
      - develop

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test --passWithNoTests

      - name: Setup GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@linkiez'

      - name: Release to GitHub Packages
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="$(git tag --sort=-version:refname | sed -n '1p')"
          yarn semantic-release
          after="$(git tag --sort=-version:refname | sed -n '1p')"
          if [ "$before" != "$after" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "released_version=${after#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup npmjs registry
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Publish to npmjs
        if: steps.release.outputs.new_release_published == 'true'
        env:
          RELEASE_CHANNEL: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_CHANNEL" = "main" ]; then
            npm publish --registry=https://registry.npmjs.org --access public --provenance
          else
            npm publish --registry=https://registry.npmjs.org --access public --provenance --tag "$RELEASE_CHANNEL"
          fi
